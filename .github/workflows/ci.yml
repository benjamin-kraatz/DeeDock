# Debug build and DeeDockTests on the same Mac image that ships.
#
# pull_request and push to main, plus workflow_dispatch. No schedule.
# Separate from Release. Do not sign, notarize, or read repository secrets.
# POSTHOG_PROJECT_TOKEN stays empty, so analytics stay a no-op.
#
# Runner: xcode-27, Benn's Mac image. The Release archive job uses the same
# label. Xcode selection below is that job's discovery step: highest
# installed Xcode, which must be major 27. It does not hardcode an app path.
#
# DOKK.app and DeeDockTests are compiled every job. DerivedData lives at a
# stable path under RUNNER_TEMP because XCBuild records absolute paths.
# The job caches package checkouts and the compiled package artifacts at
# that path. It does not cache DeeDock.build, DOKK.app, or DeeDockTests.
# There is no restore-key prefix: a partial match could reuse objects
# built for a different package lock, script, or project file.

name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  actions: write

# A new push to a PR cancels the previous run for that PR. Pushes to main
# share one group, so a newer main commit cancels the older one.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 27
        id: xcode
        run: |
          set -eu
          echo "sw_vers:"
          sw_vers
          echo "Installed Xcode apps:"
          ls -d /Applications/Xcode*.app 2>/dev/null || echo "No /Applications/Xcode*.app entries."
          selected=""
          highest_major=0
          highest_app=""
          for app in /Applications/Xcode*.app; do
            [ -d "$app" ] || continue
            version="$(defaults read "$app/Contents/Info" CFBundleShortVersionString 2>/dev/null || true)"
            major="${version%%.*}"
            echo "$app version=${version:-unknown}"
            case "$major" in
              ''|*[!0-9]*) continue ;;
            esac
            if [ "$major" -gt "$highest_major" ]; then
              highest_major="$major"
              highest_app="$app"
            fi
          done
          if [ -n "$highest_app" ]; then
            sudo xcode-select -s "$highest_app"
            selected="$highest_app"
          fi
          echo "xcode-select -p: $(xcode-select -p)"
          xcodebuild -version
          sdk="$(xcrun --sdk macosx --show-sdk-version 2>/dev/null || true)"
          echo "macosx SDK=$sdk selected=$selected"
          sdk_major="${sdk%%.*}"
          if [ "$highest_major" -lt 27 ] || [ "${sdk_major:-0}" -lt 27 ]; then
            echo "DDock builds need Xcode 27 and the macOS 27 SDK."
            echo "This xcode-27 runner reports Xcode major=$highest_major macosx SDK=$sdk."
            echo "The image labeled xcode-27 did not provide that toolchain. Tell Esi and Benn."
            exit 1
          fi
          xcode_version="$(xcodebuild -version | awk 'NR==1 { print $2 }')"
          xcode_build="$(xcodebuild -version | awk 'NR==2 { print $3 }')"
          echo "xcode_version=$xcode_version" >> "$GITHUB_OUTPUT"
          echo "xcode_build=$xcode_build" >> "$GITHUB_OUTPUT"
          echo "runner cores: hw.ncpu=$(sysctl -n hw.ncpu) hw.physicalcpu=$(sysctl -n hw.physicalcpu) hw.logicalcpu=$(sysctl -n hw.logicalcpu)"

      - name: Restore SPM source packages
        id: spm-sources
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/ci-cache/source-packages
          key: spm-sources-v3-${{ runner.os }}-${{ runner.arch }}-${{ steps.xcode.outputs.xcode_version }}+${{ steps.xcode.outputs.xcode_build }}-${{ hashFiles('DeeDock.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}

      # Restore straight into DerivedData. A copy would change timestamps
      # and the task database would treat every package output as stale.
      # Keep this path list identical to the save step. DOKK.app,
      # DeeDockTests, and DeeDock.build are not listed.
      - name: Restore SPM dependency products
        id: spm-products
        uses: actions/cache/restore@v4
        with:
          path: |
            ${{ runner.temp }}/DerivedData/Build/Intermediates.noindex/PostHog.build
            ${{ runner.temp }}/DerivedData/Build/Intermediates.noindex/XCBuildData
            ${{ runner.temp }}/DerivedData/Build/Intermediates.noindex/GeneratedModuleMaps
            ${{ runner.temp }}/DerivedData/Build/Intermediates.noindex/ExplicitPrecompiledModules
            ${{ runner.temp }}/DerivedData/Build/Intermediates.noindex/SwiftExplicitPrecompiledModules
            ${{ runner.temp }}/DerivedData/Build/Intermediates.noindex/PrecompiledHeaders
            ${{ runner.temp }}/DerivedData/ModuleCache.noindex
            ${{ runner.temp }}/DerivedData/SDKStatCaches.noindex
            ${{ runner.temp }}/DerivedData/SDKExplicitPrecompiledModules
            ${{ runner.temp }}/DerivedData/Build/Products/Debug/PackageFrameworks
            ${{ runner.temp }}/DerivedData/Build/Products/Debug/Sparkle.framework
            ${{ runner.temp }}/DerivedData/Build/Products/Debug/PostHog.swiftmodule
            ${{ runner.temp }}/DerivedData/Build/Products/Debug/PostHog.o
            ${{ runner.temp }}/DerivedData/Build/Products/Debug/PostHog.appintents
            ${{ runner.temp }}/DerivedData/Build/Products/Debug/phlibwebp.o
            ${{ runner.temp }}/DerivedData/Build/Products/Debug/PHPLCrashReporter.o
            ${{ runner.temp }}/DerivedData/Build/Products/Debug/PostHogObjCExceptionSupport.o
            ${{ runner.temp }}/DerivedData/Build/Products/Debug/PostHog_PHPLCrashReporter.bundle
            ${{ runner.temp }}/DerivedData/Build/Products/Debug/PostHog_PostHog.bundle
            ${{ runner.temp }}/DerivedData/Build/Products/Debug/include
            ${{ runner.temp }}/DerivedData/Build/Products/Debug/DerivedSources
          key: spm-products-v3-${{ runner.os }}-${{ runner.arch }}-${{ steps.xcode.outputs.xcode_version }}+${{ steps.xcode.outputs.xcode_build }}-${{ hashFiles('DeeDock.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved', '.github/workflows/ci.yml', 'scripts/build-and-test.sh', 'DeeDock.xcodeproj/project.pbxproj') }}

      - name: Build and test
        env:
          DERIVED_DATA_PATH: ${{ runner.temp }}/DerivedData
          RESULT_BUNDLE_PATH: ${{ runner.temp }}/DeeDock.xcresult
          CLONED_SOURCE_PACKAGES_PATH: ${{ runner.temp }}/ci-cache/source-packages
          SPM_SOURCES_CACHE_HIT: ${{ steps.spm-sources.outputs.cache-hit }}
          STRIP_APP_PRODUCTS: "1"
          ENABLE_CODE_COVERAGE: "NO"
        run: |
          set -eu
          set -o pipefail
          ./scripts/build-and-test.sh 2>&1 | tee "${RUNNER_TEMP}/xcodebuild.log"

      - name: Save SPM source packages
        if: success() && steps.spm-sources.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/ci-cache/source-packages
          key: ${{ steps.spm-sources.outputs.cache-primary-key }}

      - name: Save SPM dependency products
        if: success() && steps.spm-products.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ${{ runner.temp }}/DerivedData/Build/Intermediates.noindex/PostHog.build
            ${{ runner.temp }}/DerivedData/Build/Intermediates.noindex/XCBuildData
            ${{ runner.temp }}/DerivedData/Build/Intermediates.noindex/GeneratedModuleMaps
            ${{ runner.temp }}/DerivedData/Build/Intermediates.noindex/ExplicitPrecompiledModules
            ${{ runner.temp }}/DerivedData/Build/Intermediates.noindex/SwiftExplicitPrecompiledModules
            ${{ runner.temp }}/DerivedData/Build/Intermediates.noindex/PrecompiledHeaders
            ${{ runner.temp }}/DerivedData/ModuleCache.noindex
            ${{ runner.temp }}/DerivedData/SDKStatCaches.noindex
            ${{ runner.temp }}/DerivedData/SDKExplicitPrecompiledModules
            ${{ runner.temp }}/DerivedData/Build/Products/Debug/PackageFrameworks
            ${{ runner.temp }}/DerivedData/Build/Products/Debug/Sparkle.framework
            ${{ runner.temp }}/DerivedData/Build/Products/Debug/PostHog.swiftmodule
            ${{ runner.temp }}/DerivedData/Build/Products/Debug/PostHog.o
            ${{ runner.temp }}/DerivedData/Build/Products/Debug/PostHog.appintents
            ${{ runner.temp }}/DerivedData/Build/Products/Debug/phlibwebp.o
            ${{ runner.temp }}/DerivedData/Build/Products/Debug/PHPLCrashReporter.o
            ${{ runner.temp }}/DerivedData/Build/Products/Debug/PostHogObjCExceptionSupport.o
            ${{ runner.temp }}/DerivedData/Build/Products/Debug/PostHog_PHPLCrashReporter.bundle
            ${{ runner.temp }}/DerivedData/Build/Products/Debug/PostHog_PostHog.bundle
            ${{ runner.temp }}/DerivedData/Build/Products/Debug/include
            ${{ runner.temp }}/DerivedData/Build/Products/Debug/DerivedSources
          key: ${{ steps.spm-products.outputs.cache-primary-key }}

      - name: Report SPM cache sizes
        if: success()
        run: |
          set -eu
          report() {
            if [ -e "$1" ]; then
              du -sh "$1"
            else
              echo "missing $1"
            fi
          }
          report "${RUNNER_TEMP}/ci-cache/source-packages"
          report "${RUNNER_TEMP}/DerivedData/Build/Intermediates.noindex/PostHog.build"
          report "${RUNNER_TEMP}/DerivedData/Build/Intermediates.noindex/XCBuildData"
          report "${RUNNER_TEMP}/DerivedData/Build/Intermediates.noindex/SwiftExplicitPrecompiledModules"
          report "${RUNNER_TEMP}/DerivedData/ModuleCache.noindex"
          report "${RUNNER_TEMP}/DerivedData/SDKStatCaches.noindex"
          report "${RUNNER_TEMP}/DerivedData/Build/Products/Debug/Sparkle.framework"
          if [ -d "${RUNNER_TEMP}/DerivedData/Build/Products/Debug/DOKK.app" ]; then
            echo "DOKK.app is present in DerivedData and is not on the cache path."
          fi
          if [ -d "${RUNNER_TEMP}/DerivedData/Build/Intermediates.noindex/DeeDock.build" ]; then
            echo "DeeDock.build is present in DerivedData and is not on the cache path."
          fi

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-and-test-results
          path: |
            ${{ runner.temp }}/DeeDock.xcresult
            ${{ runner.temp }}/xcodebuild.log
          if-no-files-found: warn
          retention-days: 14
