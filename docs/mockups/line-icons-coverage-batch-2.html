<title>Line icons: coverage batch 2</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font: 13px/1.45 -apple-system, system-ui, sans-serif; color: var(--foreground, #e9ecf5); }
  h1 { font-size: 18px; margin: 0 0 4px; }
  p.lede { margin: 0 0 18px; color: var(--muted-foreground, #9a9ca6); }

  .head { display: flex; align-items: baseline; gap: 10px; margin-bottom: 8px; }

  .group { display: flex; flex-direction: column; gap: 6px; }
  .group > .label { font-size: 10.5px; letter-spacing: .05em; text-transform: uppercase; opacity: .6; }
  .tiles { display: flex; gap: 8px; flex-wrap: wrap; }
  .tile { position: relative; width: 104px; padding: 10px 6px 8px; border-radius: 14px; text-align: center; cursor: pointer; user-select: none;
          background: #0a12306b; border: 1px solid #ffffff1a; backdrop-filter: blur(18px); }
  .tile.chosen { width: 140px; border-color: #ffffff55; box-shadow: 0 0 0 1px #ffffff22 inset; }
  .tile.small { width: 84px; padding: 8px 4px 6px; opacity: .85; }
  .art { position: relative; width: 56px; height: 56px; margin: 0 auto 4px; }
  .chosen .art { width: 72px; height: 72px; }
  .small .art { width: 44px; height: 44px; }
  .art svg { position: absolute; inset: 0; overflow: visible; opacity: .92; filter: drop-shadow(0 0 1px #0009); transition: opacity .18s, filter .18s; }
  .glow { position: absolute; inset: 10%; border-radius: 50%; opacity: 0; filter: blur(18px); transition: opacity .3s;
          background: conic-gradient(#ff5fa2, #ff9a3c, #3c8cff, #a55cff, #ff5fa2); }
  .tile:hover .glow, .tile.lit .glow { opacity: .9; transition-duration: .18s; }
  .tile:hover svg, .tile.lit svg { opacity: 1; filter: drop-shadow(0 0 4px #fff9); }
  .name { font-weight: 600; font-size: 11.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .note { font-size: 10.5px; opacity: .7; margin-top: 3px; line-height: 1.3; }
  .ref img { width: 56px; height: 56px; display: block; margin: 0 auto 4px; }
  .ref { width: 104px; text-align: center; padding: 10px 6px 8px; }
  .strip { display: flex; gap: 10px; align-items: center; padding: 8px 12px; border-radius: 12px; background: #ffffff14; border: 1px solid #ffffff1f; align-self: flex-start; }
  .strip .dock { display: flex; gap: 6px; align-items: center; }
  .strip svg { display: block; overflow: visible; }
  .sizes { display: flex; gap: 12px; align-items: flex-end; }
  .sizes .s { display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 10px; opacity: .6; }
  .why { margin: 10px 0 0; font-size: 12.5px; color: var(--muted-foreground, #9a9ca6); max-width: 70ch; }
  .why b { color: var(--foreground, #e9ecf5); font-weight: 600; }
  .bar { display: flex; gap: 12px; align-items: center; margin: 0 0 16px; }
  button { font: inherit; color: inherit; padding: 5px 12px; border-radius: 999px; border: 1px solid #8884; background: #8882; cursor: pointer; }
  label { display: flex; gap: 8px; align-items: center; }
  input[type=range] { width: 200px; }
</style>
<h1>Line icons: nineteen apps from DEE-123</h1>
<p class="lede">Hover a tile to play its motion as the dock does. The big tile is the pick; the smaller ones are the alternatives weighed. <b>Among its neighbours</b> shows the pick at dock size beside the catalog glyphs it will sit near in the Launcher.</p>

    const ref = document.createElement("div"); ref.className = "tile ref";
    ref.innerHTML = `<img alt=""><div class="name">App icon</div><div class="note">macOS reference</div>`;
    ref.querySelector("img").src = app.icon;
    group("Reference", [ref]);
  }
  group("Pick", [tileElement(app.chosen, "chosen")]);
  group("Alternatives", app.alts.map(t => tileElement(t, "small")));
  const strip = document.createElement("div"); strip.className = "strip";
  const dock = document.createElement("div"); dock.className = "dock";
  for (const n of app.neighbours) dock.append(svgFor(n, 44).svg);
  const pick = svgFor(app.chosen, 44).svg; pick.style.outline = "1px solid #ffffff55"; pick.style.borderRadius = "8px";
  dock.append(pick);
  const sizes = document.createElement("div"); sizes.className = "sizes";
  for (const [px, w] of [[32, 1.5], [24, 1.6], [18, 1.7]]) {
    const s = document.createElement("div"); s.className = "s";
    s.append(svgFor(app.chosen, px, w).svg); const t = document.createElement("span"); t.textContent = px + "px"; s.append(t);
    sizes.append(s);
  }
  strip.append(dock, sizes);
  group("Among its neighbours, and small", [strip]);
  root.append(section);
}
document.getElementById("play").addEventListener("click", () => players.forEach(p => p.play()));
const scrub = document.getElementById("scrub"), at = document.getElementById("at");
const hold = () => { at.textContent = +scrub.value >= 1 ? "rest" : (+scrub.value).toFixed(2); players.forEach(p => p.draw(+scrub.value)); };
scrub.addEventListener("input", hold);
const held = new URLSearchParams(location.search).get("t");
if (held !== null) { scrub.value = held; hold(); }
</script>
